packages:
  - .
# hoisted 布局（无符号链接、扁平 node_modules）：electron-builder 打包后
# 依赖解析正常，且 dsh profile 初始化依赖「安装包内依赖闭包」的解析。
nodeLinker: hoisted
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
  electron: true
  # Windows 安装器生成器（electron-builder 26 → electron-builder-squirrel-windows
  # → electron-winstaller），自带 install 脚本选 7z 架构二进制。本项目只出
  # Linux deb，这条路径用不到，故显式拒绝而不是允许。
  #
  # 必须写 false、不能省略：pnpm v11 的 strictDepBuilds 默认为 true，未列出的
  # 构建脚本会让整个 install 以 ERR_PNPM_IGNORED_BUILDS 失败；只有显式 false
  # 才是「已决策、静默跳过」。
  electron-winstaller: false
minimumReleaseAge: 0

# 传递依赖的安全 override。
#
# 下面这些包都**不是**我们的直接依赖，Dependabot 修不了：它的安全更新是
# 「抬高一个显式声明的依赖、把修复带上来」。这两条链路上唯一的显式依赖，
# 一个是 @deepseek-ai/dsh（在 .github/dependabot.yml 的 ignore 里，而 ignore
# 对安全更新同样生效），另一个 electron-builder 已经是最新 —— 两个都抬不动，
# 所以 21 条告警挂了 5 天、零 PR。`pnpm update <包名>` 也不可靠：实测只挪动了
# sharp 与一半 js-yaml。要确定性就只能在这里钉解析结果。
#
# 每条都落在父包**声明的区间内**（除末尾注明「背离声明区间」的 fflate / plist 两条外，
# 其余全部如此），即「一次崭新的 pnpm install 本来就会选到的版本」，没有逆着上游改行为。
overrides:
  fast-uri: 3.1.8 # ajv ^3.0.1；SSRF / host confusion（替换旧钉 3.1.6——3.1.6 自身现
  # 也入告警：authority injection via unvalidated port、bracket host confusion）
  ip-address: 10.7.3 # express-rate-limit ^10.2.0；isLinkLocal 前缀过宽 / NAT64 分类缺失
  # （替换旧钉 10.5.1——10.5.1 自身现也入告警 <=10.7.0：isInSubnet/isHostInSubnet 跨地址族
  # 比较让白名单放进区间外地址、Address6 诊断串长度无上限可被超长输入拖死）
  js-yaml: 4.3.2 # cordis-plugin-include ^4.1.0；空 merge 源把 CPU 打满（high）
  qs: 6.16.0 # express ^6.14.0 / body-parser ^6.15.2；DoS
  hono: 4.13.12 # @hono/node-server peer ^4 / mcp sdk ^4.11.4；查询串 / parseBody，现为
  # jsx 边界组件不转义字符串（XSS，<4.13.7）；旧钉 4.13.5 已入告警区间
  '@xmldom/xmldom': 0.9.12 # plist 3.1.1 声明 ^0.9.10，正好收得下（9 条告警的来源）
  # ↓ 以下四条是 dev / 构建期闭包（不进 .deb），Dependabot 的安全更新同样开不出 PR
  # ——父包（wait-on / app-builder-lib）都已是各自最新，抬不动；到期不修同样会一直挂告警：
  axios: 1.20.0 # wait-on ^1.18.1；10 条告警（4 high：HTTP/2 适配器绕过 DNS/proxy、
  # toFormData 原型污染、继承 createConnection 劫持 socket、fetch 适配器不守 maxRedirects）
  # ↓ brace-expansion 三份副本各自按条目声明区间钉住（`{a},b}` 重写二次方复杂度，medium；
  # 1.x/2.x 另有 2 条 high：GHSA-6j4f-fj2g-mc7p、GHSA-qhr7-859c-m2p7，均为构建期闭包）。
  # 用 `包@主版本` 选择器逐个钉，不能写成全局 `brace-expansion: <v>`——那会把
  # minimatch 3.1.5 的 ^1.1.7、5.1.9/9.0.9 的 ^2.0.1、10.2.6 的 ^5 全顶到同一个主版本。
  'brace-expansion@1': 1.1.21 # minimatch 3.1.5 声明 ^1.1.7
  'brace-expansion@2': 2.1.7 # minimatch 5.1.9 / 9.0.9 声明 ^2.0.1
  'brace-expansion@5': 5.0.12 # minimatch 10.2.6 声明 ^5
  # ↓ 这两条父包是**精确 pin**，override 是唯一的杠杆，也是仅有两处背离声明区间的改动：
  fflate: 0.8.3 # @deepseek-ai/libreoffice-kit 精确锁 0.8.2，且上游最新的 0.1.2
  # 仍锁 0.8.2（畸形 ZIP64 → unzipSync 死循环）。顺带把 dsh-session-log-export
  # 那份 0.8.3 副本合并过来，少一份重复。
  plist: 3.1.1 # app-builder-lib 精确锁 3.1.0，而 3.1.0 声明 xmldom ^0.8.0
  # ——会把 xmldom 拖回不安全的 0.8.x；3.1.1 声明 ^0.9.10，才能与上面的
  # 0.9.12 对齐（顺带把两份 plist 合并成一份）。仅在构建期解析自家 plist。
  # ↓ dsh 0.2.1-alpha.2 闭包引入的四条安全告警，父包声明区间均收得下：
  proxy-addr: 2.0.8 # express 5.2.1 声明 ^2.0.7；IPv4-mapped 地址 IP 欺骗（critical）
  http-cache-semantics: 4.3.0 # cacheable-request 7/13 声明 ^4.2.0；max-stale 信息泄露（high）
  compression: 1.8.2 # dsh-host-webserver 0.2.1-alpha.2 声明 ^1.8.1；内存 DoS（high）
  '@modelcontextprotocol/sdk': 1.32.1 # @google/genai / pi-ai 声明 ^1.25.2；OAuth 客户端
  # 向 MCP server 指定的授权服务器泄露凭据（high）。1.31.0 起修复，取区间内最新 1.32.1。
