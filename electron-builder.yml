appId: com.dsh.desktop
productName: DSH Desktop
copyright: Copyright © 2026 DSH Desktop

# 自动更新（021）：electron-updater 读取的发布源
publish:
  provider: github
  owner: Oissp
  repo: dsh-desktop

directories:
  output: out
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - build/tray/**/*
  - build/brand/**/*
  - package.json

# 不使用 asar：dsh profile 初始化会为安装包内的依赖创建符号链接，
# 需要真实文件路径（asar 内的符号链接目标不可靠）。
asar: false

npmRebuild: false

# Electron 版本跟随 devDependencies（现为 44.4.5）。
# 历史：42.9.3 曾钉死仅供 Linux（PR #304 实践），因 Electron 43.x 在 GNOME
# 下托盘 SNI 回归（43.4.0 IconPixmap Get 报错 / 43.4.1 注册被拒，上游 #52674/
# #53138/#53213）；43.5.0 与 44.1.0 起已修复，故撤掉 pin 恢复跟随。

# 复制完整 node_modules（见 scripts/after-pack.mjs）
afterPack: scripts/after-pack.mjs

# 原生模块（node-pty / koffi）解包，保证 dsh 引擎（独立 Node 进程）下可加载
asarUnpack:
  - node_modules/.pnpm/node-pty*/**/*
  - node_modules/.pnpm/koffi*/**/*

# 产物见 .github/workflows/build-release.yml：Debian 13 / amd64 .deb。
linux:
  # 指向 build/icons 目录（标准 hicolor 命名 <size>x<size>.png）：electron-builder
  # 据此把各尺寸装进 /usr/share/icons/hicolor/<size>x<size>/apps/，桌面环境才能在
  # 程序菜单显示图标。若指向单张 1024×1024 的 icon.png，app-builder 只会返回一个
  # 1024 尺寸，而 hicolor 主题不声明 1024 目录 → 菜单图标不显示。
  icon: build/icons
  category: Development
  target:
    - target: deb
      arch:
        - x64
  maintainer: Oissp <19642615+Oissp@users.noreply.github.com>

  # desktopName（package.json = com.dsh.desktop.desktop）对齐三处标识，缺一不可：
  #   · 运行时 app_id / X11 WM_CLASS —— Electron 启动时读 package.json 的 desktopName
  #     （等价于 app.setDesktopName，但那个 API 必须在 ready 之前调用，见 main.ts 注释）
  #   · .desktop 里的 StartupWMClass —— electron-builder 取 desktopName（去 .desktop 后缀），
  #     **缺 desktopName 时回退成 productName**（LinuxTargetHelper.js:259），
  #     于是写出 StartupWMClass=DSH Desktop，与运行时的 app_id 对不上
  #   · .desktop 文件名 —— syncDesktopName 才按 desktopName 派生，否则用 executableName
  # 前两者不一致时，X11 会话下窗口关联不到启动器条目（任务栏出重复/无关联图标）；
  # Wayland 走 app_id 看不出问题，所以这个错很容易漏到发版。
  #
  # desktopName 取 reverse-DNS 形式且与 appId 同源：Electron 文档要求该值是
  # reverse-DNS 风格 ID，xdg-desktop-portal 1.21+ 也会拒绝解析不到已安装 .desktop
  # 文件的 app ID（GNOME 50 起因此静默拒绝 globalShortcut 绑定）。这使 .desktop
  # 文件名从 dsh-desktop.desktop 变为 com.dsh.desktop.desktop —— 已固定到启动器的
  # 用户需要重新固定一次（仅此一次，之后三者同值不再变）。
  # 注意 Icon= 用的是 executableName（dsh-desktop），与文件名无关，不受影响。
  syncDesktopName: true

# deb 压缩：保持默认 xz（fpm 1.9.3 只支持 gz|bzip2|xz）。实测 623MB 原始数据，
# xz -3 在三个支持的压缩里体积最小（~138MB）且最快（CI ~2min）；gzip -9 更慢更大
# （~185MB）、bzip2 -9 也更慢更大（~158MB）。故不做覆盖，不要为此加 deb 配置。
# （zstd 需要新版 fpm，bundled fpm 1.9.3 的 --deb-compression 不认 zst。）
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
