appId: com.dsh.desktop
productName: DSH Desktop
copyright: Copyright © 2026 DSH Desktop

# 自动更新（021）：electron-updater 读取的发布源
publish:
  provider: github
  owner: Oissp
  repo: dsh-desktop

directories:
  output: out
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - plugins/**/*
  - build/icon.png
  - build/tray/**/*
  - build/brand/**/*
  - package.json

# 不使用 asar：dsh profile 初始化会为安装包内的依赖创建符号链接，
# 需要真实文件路径（asar 内的符号链接目标不可靠）。
asar: false

npmRebuild: false

# Electron 版本跟随 devDependencies（现为 44.2.0，所有平台一致）。
# 历史：42.9.3 曾钉死仅供 Linux（PR #304 实践），因 Electron 43.x 在 GNOME
# 下托盘 SNI 回归（43.4.0 IconPixmap Get 报错 / 43.4.1 注册被拒，上游 #52674/
# #53138/#53213）；43.5.0 与 44.1.0 起已修复，故撤掉 pin 恢复跟随。

# 复制完整 node_modules（见 scripts/after-pack.mjs）
afterPack: scripts/after-pack.mjs

# 原生模块（node-pty / koffi）解包，保证 ELECTRON_RUN_AS_NODE 下可加载
asarUnpack:
  - node_modules/.pnpm/node-pty*/**/*
  - node_modules/.pnpm/koffi*/**/*

# 平台产物见 .github/workflows/build-release.yml：Linux 构建 Debian 13 / amd64 .deb，
# macOS 构建 arm64 的 dmg + zip；各平台 Electron 版本均跟随 devDependencies。
linux:
  # 指向 build/icons 目录（标准 hicolor 命名 <size>x<size>.png）：electron-builder
  # 据此把各尺寸装进 /usr/share/icons/hicolor/<size>x<size>/apps/，桌面环境才能在
  # 程序菜单显示图标。若指向单张 1024×1024 的 icon.png，app-builder 只会返回一个
  # 1024 尺寸，而 hicolor 主题不声明 1024 目录 → 菜单图标不显示。
  icon: build/icons
  category: Development
  target:
    - target: deb
      arch:
        - x64
  maintainer: Oissp <19642615+Oissp@users.noreply.github.com>

# macOS：dmg（分发）+ zip（electron-updater 增量更新），仅 arm64（Apple Silicon）。
# 未配置证书时 identity: null 跳过签名（与 Linux CI 做法一致，见 REPORT-017）。
# 启用签名/公证：提供 CSC_LINK / CSC_KEY_PASSWORD（p12）后删除 identity 行（或改为
# 证书名），并设置 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID（公证）。
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  # 与 deb 的 ${name}_${version}_${arch} 命名保持一致，避免默认的
  # "${productName} ${version} ${arch}"（含空格）导致产物名不可预期。
  artifactName: ${name}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  identity: null

# deb 压缩：保持默认 xz（fpm 1.9.3 只支持 gz|bzip2|xz）。实测 623MB 原始数据，
# xz -3 在三个支持的压缩里体积最小（~138MB）且最快（CI ~2min）；gzip -9 更慢更大
# （~185MB）、bzip2 -9 也更慢更大（~158MB）。故不做覆盖，不要为此加 deb 配置。
# （zstd 需要新版 fpm，bundled fpm 1.9.3 的 --deb-compression 不认 zst。）
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
